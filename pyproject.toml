[project]
name = "searchable-jpg-pdf"
version = "0.1.0"
description = "Create searchable PDFs from scanned JPG images using OCR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "reportlab>=4.0",
]

[project.scripts]
searchable-pdf = "software:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "software"
